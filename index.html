.tk-btn{width:100%;padding:14px;border:none;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:800;cursor:pointer;margin-top:18px}

ari lagi", "4 hari lagi"], "k": 3}, {"t": "pg", "q": "<p>Perhatikan pohon faktor dua bilangan berikut.<br>72 = 2³ × 3²<br>96 = 2⁵ × 3<br>Pak Kades akan membagi 72 tongkat bambu dan 96 tongkat rotan ke dalam kantong-kantong dengan isi yang sama banyak; setiap kantong berisi kedua jenis tongkat. Jika kantong yang dibuat sebanyak mungkin, isi setiap kantong adalah ….</p>", "o": ["3 tongkat bambu dan 4 tongkat rotan", "4 tongkat bambu dan 3 tongkat rotan", "2 tongkat bambu dan 4 tongkat rotan", "24 tongkat bambu dan 24 tongkat rotan"], "k": 0}, {"t": "pg", "q": "<p>Bu Guru menulis di papan tulis: \"Taksirlah hasil 78 × 42 dengan membulatkan setiap bilangan ke puluhan terdekat.\" Hasil taksiran yang benar adalah ….</p>", "o": ["3.200", "2.800", "3.600", "4.000"], "k": 0}, {"t": "pg", "q": "<p>Dalam percobaan IPA, suhu sebotol cairan mula-mula 74°C. Setelah dipanaskan, suhu cairan naik 18°C. Cairan itu kemudian didinginkan dalam beberapa tahap; setiap tahap menurunkan suhu sebesar 6°C. Setelah tahap pendinginan terakhir, suhu cairan menjadi 32°C. Banyak tahap pendinginan yang dilakukan adalah ….</p>", "o": ["7 tahap", "10 tahap", "12 tahap", "15 tahap"], "k": 1}, {"t": "pg", "q": "<p>Ibu membeli sebotol sirup berisi 1 3/4 liter. Sebanyak 5/8 liter dipakai untuk membuat es buah pada acara arisan. Sisa sirup di dalam botol adalah ….</p>", "o": ["875 mL", "1.000 mL", "1.250 mL", "1.125 mL"], "k": 3}, {"t": "pg", "q": "<p>Empat botol minuman berlabel takaran gula per sajian: Botol P = 5/6 sendok, Botol Q = 7/9 sendok, Botol R = 4/5 sendok, dan Botol S = 9/11 sendok. Botol dengan takaran gula terbesar adalah ….</p>", "o": ["Botol P", "Botol S", "Botol R", "Botol Q"], "k": 0}, {"t": "pg", "q": "<p>Panitia peringatan hari besar mempunyai 84 permen dan 60 cokelat. Keduanya akan dibagikan ke dalam kantong-kantong bingkisan dengan isi yang sama banyak, dan setiap kantong berisi kedua jenis makanan itu. Jika kantong yang dibuat sebanyak mungkin, setiap kantong berisi ….</p>", "o": ["7 permen dan 5 cokelat", "5 permen dan 7 cokelat", "14 permen dan 10 cokelat", "12 permen dan 12 cokelat"], "k": 0}, {"t": "pg", "q": "<p>Panitia konser sekolah mengumpulkan dana dari 38 siswa, masing-masing sebesar Rp26.000,00. Untuk laporan cepat, bendahara menaksir total dana dengan membulatkan banyak siswa, 38, menjadi 40. Selisih taksiran bendahara dengan jumlah dana sebenarnya adalah ….</p>", "o": ["Rp12.000,00", "Rp40.000,00", "Rp52.000,00", "Rp988.000,00"], "k": 2}, {"t": "pg", "q": "<p>Papan nama sekolah dipasangi dua lampu hias. Lampu merah berkedip setiap 20 detik dan lampu biru berkedip setiap 28 detik. Pada pukul 06.15.00 kedua lampu berkedip bersamaan. Kedua lampu akan berkedip bersamaan lagi pada pukul ….</p>", "o": ["06.16.20", "06.17.20", "06.19.00", "06.24.20"], "k": 1}, {"t": "pg", "q": "<p>Perhatikan denah lantai sebuah ruang kelas berikut. Lantai berukuran 360 cm × 270 cm akan dipasangi ubin persegi berukuran 45 cm × 45 cm dengan syarat tidak ada ubin yang dipotong.</p><img class=\"tk-img\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAtAAAAIcCAMAAADoo2lhAAADAFBMVEX+/v4CAgLn5+enp6f1o1mGhoa6urqZmZnIyMjX19cbGxs7OztZWFhHR0dnaGgnJyfnmVR2dnbHhEg3JBQoHRK3eUKNYDf/smLwn1cjFwyUYjbTjEyHWTESDAZnRCUbEgqkbTzAf0RaOyCscj5CLBjdklBNMxt8Ui3/rmBgXl5zTCpSNh2vdECAVS7ZkE81MS1tb3DQz88yLCg9P0A/QUJEQD1dX2FgPyJgYF/roFcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA pqbGeVTvaltTEVoYbWGnre7UW2IlZEhczsQ6dp9oVMb7bPuB6GpHrnfsRUPji4RxiRWKMSHUT6mdzu5CxAH1Vd0uh4P5gB2Ceii6i6+Ff4YgCIIgCIIgCIIgCIIgCIIgCIIgCIIgCIIgCIIgCIIgCIIgCIIgCIIg6BT1/wEZ1PGN0EtGSAAAAABJRU5ErkJggg==\" alt=\"Grafik volume air terhadap waktu pengisian tangki\"><p>Jika pengisian dilanjutkan dengan laju yang sama, volume air dalam tangki setelah 10 menit adalah ….</p>", "o": ["1.200 liter", "1.800 liter", "1.500 liter", "900 liter"], "k": 2}, {"t": "pg", "q": "<p>Hasil tangkapan ikan dari sebuah perahu nelayan di Pantai Klayar dijual seharga Rp1.200.000,00. Uang hasil penjualan dibagikan kepada pemilik perahu, nahkoda, dan anak buah kapal (ABK) dengan perbandingan 3 : 4 : 5. Dalam perjalanan itu perahu juga mengangkut dua orang penumpang wisata. Bagian yang diterima ABK adalah ….</p>", "o": ["Rp300.000,00", "Rp400.000,00", "Rp500.000,00", "Rp600.000,00"], "k": 2}, {"t": "pg", "q": "<p>Sebuah mesin pencetak di percetakan dekat Terminal Pacitan bekerja dengan kecepatan tetap. Catatan kerjanya ditunjukkan pada tabel berikut.</p><table class=\"tk-tabel\"><tr><th>Banyak halaman</th><th>Waktu (detik)</th></tr><tr><td>12</td><td>4</td></tr><tr><td>24</td><td>8</td></tr><tr><td>60</td><td>20</td></tr></table><p>Waktu yang dibutuhkan mesin tersebut untuk mencetak 90 halaman adalah ….</p>", "o": ["30 detik", "24 detik", "36 detik", "45 detik"], "k": 0}, {"t": "pg", "q": "<p>Sebuah asrama siswa di Pacitan mempunyai persediaan beras yang cukup untuk 25 siswa selama 18 hari. Persediaan itu baru terpakai selama 6 hari ketika 5 siswa pulang kampung dan tidak kembali ke asrama. Jika kebutuhan beras setiap siswa setiap hari sama, persediaan beras tersebut akan habis pada hari ke-… sejak persediaan mulai dipakai.</p>", "o": ["18", "20", "21", "23"], "k": 2}, {"t": "pg", "q": "<p>Sebuah mobil travel jurusan Pacitan–Ponorogo menempuh perjalanan dengan kecepatan rata-rata 60 km/jam dalam waktu 2,5 jam. Jika pada perjalanan berikutnya mobil travel itu melaju dengan kecepatan rata-rata 75 km/jam pada rute yang sama, waktu yang dibutuhkan adalah ….</p>", "o": ["1,5 jam", "2,5 jam", "3 jam", "2 jam"], "k": 3}, {"t": "pg", "q": "<p>Sebuah kolam renang anak di tempat wisata pemandian Banyu Anget dapat diisi penuh oleh pipa A saja dalam waktu 6 jam, atau oleh pipa B saja dalam waktu 4 jam. Kolam tersebut berkapasitas 1.200 liter. Jika kedua pipa digunakan bersama-sama, waktu yang dibutuhkan untuk mengisi kolam sampai penuh adalah ….</p>", "o": ["2 jam", "2 jam 24 menit", "2 jam 30 menit", "10 jam"], "k": 1}, {"t": "pg", "q": "<p>Pada praktikum IPA, Lala mengamati sel darah merah di bawah mikroskop. Dalam buku catatannya tertulis bahwa diameter sel darah merah sekitar 0,0000075 m. Bentuk notasi ilmiah dari diameter tersebut adalah ….</p>", "o": ["7,5 × 10⁻⁶ m", "7,5 × 10⁶ m", "75 × 10⁻⁵ m", "0,75 × 10⁻⁶ m"], "k": 0}, {"t": "pg", "q": "<p>Pada babak cepat tepat lomba matematika antarkelas, Bima diminta menyederhanakan bentuk 5⁶ ÷ 5². Hasil paling sederhana dari bentuk tersebut adalah ….</p>", "o": ["5³", "5⁸", "5⁴", "5¹²"], "k": 2}, {"t": "pg", "q": "<p>Bu Lastri membeli ubin keramik berbentuk persegi dengan luas 200 cm² untuk lantai dapurnya. Di tengah ubin terdapat motif garis diagonal dari satu sudut ke sudut berlawanan. Panjang garis diagonal motif tersebut adalah ….</p>", "o": ["10√2 cm", "20 cm", "20√2 cm", "40 cm"], "k": 1}, {"t": "pg", "q": "<p>Untuk prakarya, Tania membuat hiasan berbentuk segitiga dari kawat. Panjang ketiga sisi hiasan tersebut adalah √12 cm, √27 cm, dan √75 cm. Panjang kawat yang dibutuhkan Tania untuk membuat satu hiasan adalah ….</p>", "o": ["8√3 cm", "9√3 cm", "√114 cm", "10√3 cm"], "k": 3}, {"t": "pg", "q": "<p>Panitia lomba membuat kartu teka-teki untuk membuka brankas hadiah di perpustakaan sekolah. Pada kartu tertulis: \"Diketahui 4^x = 64. Kode kedua adalah nilai dari 4^(x−1).\" Kode kedua yang benar adalah ….</p>", "o": ["8", "16", "32", "256"], "k": 1}, {"t": "pg", "q": "<p>Kelompok wanita tani di Desa Ketro mengolah ketela menjadi keripik. Keuntungan dari setiap karung ketela yang diolah dinyatakan dengan model (6m² − 5m + 11) ribu rupiah, dengan m adalah suatu bilangan yang menyatakan kode karung. Pada minggu ini kelompok itu berhasil mengolah 25 karung. Koefisien dari m pada model keuntungan tersebut adalah ….</p>", "o": ["6", "5", "−5", "11"], "k": 2}, {"t": "pg", "q": "<p>Pertandingan voli antardesa dalam rangka HUT kecamatan diadakan di GOR Pacitan. Panitia mencatat penonton di tribun timur sebanyak (5n − 2) orang dan di tribun barat sebanyak (3n + 7) orang. Banyak seluruh penonton di kedua tribun dinyatakan dalam n adalah ….</p>", "o": ["(8n + 9) orang", "(2n + 5) orang", "(8n − 5) orang", "(8n + 5) orang"], "k": 3}, {"t": "pg", "q": "<p>Musala sekolah akan dipasangi karpet baru. Daerah yang dipasangi karpet berbentuk persegi panjang dengan panjang (2x − 1) m dan lebar (x + 4) m. Luas daerah yang dipasangi karpet dinyatakan dalam x adalah ….</p>", "o": ["(2x² + 9x − 4) m²", "(2x² + 7x − 4) m²", "(2x² + 7x + 4) m²", "(2x² − 7x − 4) m²"], "k": 1}, {"t": "pg", "q": "<p>Sebuah petak kebun sayur berbentuk persegi panjang mempunyai luas (x² + x − 6) m². Petak itu akan diberi bambu pembatas mengikuti bentuknya. Kemungkinan bentuk panjang dan lebar petak kebun tersebut adalah ….</p>", "o": ["(x − 3) m dan (x + 2) m", "(x + 6) m dan (x − 1) m", "(x + 3) m dan (x − 2) m", "(x − 6) m dan (x + 1) m"], "k": 2}, {"t": "pg", "q": "<p>Laboratorium komputer sekolah memasang program kalkulator khusus. Program itu menerima masukan dua bilangan p dan q, lalu mengeluarkan hasil (p² − q²) ÷ (p − q). Jika dimasukkan p = 7 dan q = 3, keluaran program tersebut adalah ….</p>", "o": ["4", "10", "40", "58"], "k": 1}, {"t": "pg", "q": "<p>Untuk pameran karya sekolah, siswa kelas IX membuat maket jembatan gantung dengan skala 1 : 400. Panjang maket jembatan tersebut adalah 45 cm. Panjang jembatan yang sebenarnya adalah ….</p>", "o": ["180 m", "18 m", "90 m", "1.800 m"], "k": 0}, {"t": "pg", "q": "<p>Mobil operasional sekolah digunakan untuk perjalanan antarkota. Catatan pemakaian bahan bakar mobil tersebut sebagai berikut.</p><table class=\"tk-tabel\"><tr><th>Jarak tempuh</th><th>Bahan bakar</th></tr><tr><td>40 km</td><td>2 liter</td></tr><tr><td>90 km</td><td>4,5 liter</td></tr><tr><td>150 km</td><td>7,5 liter</td></tr></table><p>Jarak yang dapat ditempuh mobil tersebut dengan 6 liter bahan bakar adalah ….</p>", "o": ["100 km", "135 km", "160 km", "120 km"], "k": 3}, {"t": "mcma", "q": "<p>Dita dan Raka menabung sejak tiga bulan lalu untuk keperluan lomba. Perbandingan uang tabungan Dita dan Raka adalah 7 : 4, sedangkan selisih uang tabungan mereka Rp30.000,00. Pernyataan yang benar adalah ….</p>", "o": ["Uang tabungan Dita adalah Rp70.000,00", "Uang tabungan Raka adalah Rp40.000,00", "Jumlah uang tabungan mereka adalah Rp110.000,00", "Uang tabungan Dita dua kali uang tabungan Raka"], "k": [0, 1, 2]}, {"t": "mcma", "q": "<p>Seorang pengrajin di sentra kerajinan Pacitan membuat bingkai foto berbentuk persegi dengan panjang sisi (x + 2) cm. Pernyataan yang benar tentang bingkai tersebut adalah ….</p>", "o": ["Keliling bingkai adalah (4x + 8) cm", "Luas daerah di dalam bingkai adalah (x² + 4x + 4) cm²", "Jika x = 5, luas daerah di dalam bingkai adalah 49 cm²", "Jika x = 5, keliling bingkai adalah 30 cm"], "k": [0, 1, 2]}, {"t": "mcma", "q": "<p>Dalam permainan kartu \"Tangkap Jebakan\" di kelas, setiap pemain harus menilai kesamaan berikut. Kesamaan yang benar adalah ….</p>", "o": ["2⁻³ = 1/8", "(1/3)⁻² = 9", "16^(1/2) = 4", "5² × 5⁻² = 5⁴"], "k": [0, 1, 2]}, {"t": "mcma", "q": "<p>Kelompok usaha anyaman pandan di Kebonagung menerima pesanan topi anyaman. Dengan 8 orang pengrajin, pesanan 160 topi dapat diselesaikan dalam 4 hari. Setiap pengrajin mempunyai kemampuan yang sama, dan topi dijual seharga Rp15.000,00 per buah. Pernyataan yang benar adalah ….</p>", "o": ["Seorang pengrajin membuat 5 topi dalam satu hari", "Delapan pengrajin membuat 320 topi dalam 8 hari", "Empat pengrajin menyelesaikan 160 topi dalam 8 hari", "Agar 160 topi selesai dalam 2 hari, dibutuhkan 12 pengrajin"], "k": [0, 1, 2]}, {"t": "mcma", "q": "<p>Guru menuliskan beberapa penguraian bentuk aljabar pada lembar latihan siswa. Penguraian yang benar adalah ….</p>", "o": ["(x + 3)² = x² + 6x + 9", "(x − 5)² = x² − 25", "(2x + 1)(2x − 1) = 4x² − 1", "(x + 4)(x − 4) = x² + 16"], "k": [0, 2]}, {"t": "kat", "q": "<p>Untuk mading kelas, siswa kelas IX-B menggambar denah kelas mereka dengan skala 1 : 50. Tentukan Benar/Salah untuk setiap pernyataan.</p>", "s": ["Setiap 1 cm pada denah mewakili 50 cm ukuran sebenarnya", "Panjang kelas sebenarnya 8 m digambar sepanjang 20 cm pada denah", "Lebar denah 12 cm menunjukkan lebar kelas sebenarnya 6 m", "Skala 1 : 50 berarti setiap 1 cm pada denah mewakili 50 m ukuran sebenarnya"], "k": [true, false, true, false]}, {"t": "kat", "q": "<p>Sebuah bus pariwisata berangkat dari Pacitan menuju Yogyakarta yang berjarak 240 km. Dalam perjalanan, bus beristirahat satu kali selama 30 menit. Tentukan Benar/Salah untuk setiap pernyataan.</p>", "s": ["Dengan kecepatan rata-rata 60 km/jam selama berjalan, waktu yang dibutuhkan selama bus berjalan adalah 4 jam", "Dengan kecepatan rata-rata 80 km/jam selama berjalan, bus tiba dalam waktu 2 jam 30 menit", "Jika waktu tempuh selama berjalan adalah 5 jam, kecepatan rata-rata bus adalah 48 km/jam", "Jika bus berangkat pukul 07.00 dengan kecepatan rata-rata 60 km/jam selama berjalan, bus tiba di Yogyakarta pukul 11.30"], "k": [true, false, true, true]}, {"t": "kat", "q": "<p>Kelompok tani di sebuah desa di Kecamatan Tulakan mencampurkan tiga jenis pupuk untuk tanaman jagung di lahan seluas dua hektare. Perbandingan berat pupuk Urea, SP-36, dan KCl dalam campuran adalah 2 : 3 : 5. Satu karung campuran beratnya 50 kg. Tentukan Benar/Salah untuk setiap pernyataan.</p>", "s": ["Berat pupuk Urea dalam satu karung campuran adalah 10 kg", "Berat pupuk KCl dalam satu karung campuran adalah 25 kg", "Selisih berat pupuk SP-36 dan pupuk Urea dalam satu karung adalah 10 kg", "Untuk membuat 80 kg campuran, dibutuhkan pupuk Urea sebanyak 16 kg"], "k": [true, true, false, true]}, {"t": "kat", "q": "<p>Lala memeriksa kembali lembar latihan bilangan berpangkat dan bentuk akar miliknya. Tentukan Benar/Salah untuk setiap pernyataan.</p>", "s": ["Nilai dari √144 adalah 12", "Nilai dari 10⁻³ adalah 0,001", "Bentuk sederhana dari √18 adalah 2√3", "Hasil dari 2,5 × 10⁵ adalah 25.000"], "k": [true, true, false, false]}, {"t": "kat", "q": "<p>Seorang wisatawan asing di Pantai Klayar menukarkan uangnya di sebuah tempat penukaran uang. Nilai tukar yang berlaku adalah 1 dolar Amerika (USD) = Rp16.000,00, dan wisatawan itu juga membawa uang euro dalam dompetnya. Tentukan Benar/Salah untuk setiap pernyataan.</p>", "s": ["Uang 5 USD setara dengan Rp80.000,00", "Uang Rp240.000,00 setara dengan 14 USD", "Uang 12 USD setara dengan Rp180.000,00", "Uang Rp1.000.000,00 nilainya lebih besar daripada 60 USD"], "k": [true, false, false, true]}]}, {"nama": "Aljabar", "sub": "PLSV & PtLSV · SPLDV · Relasi, Fungsi & Korespondensi Satu-Satu · Barisan dan Deret", "items": [{"t": "pg", "q": "<p>Pak Slamet membeli 5 kg jeruk di Pasar Pacitan. Ia membayar dengan selembar uang Rp100.000,00 dan menerima kembalian Rp25.000,00. Harga jeruk per kilogram adalah ….</p>", "o": ["Rp20.000,00", "Rp25.000,00", "Rp15.000,00", "Rp12.500,00"], "k": 2}, {"t": "pg", "q": "<p>Tarif masuk kawasan Pantai Srau adalah Rp8.000,00 per orang. Sebuah rombongan membayar dengan selembar uang Rp50.000,00 dan menginginkan uang kembalian <b>tidak kurang dari</b> Rp10.000,00. Jika n menyatakan banyaknya pengunjung dalam rombongan itu, model matematika yang sesuai adalah ….</p>", "o": ["50.000 − 8.000n &gt; 10.000", "50.000 − 8.000n ≥ 10.000", "8.000n − 50.000 ≥ 10.000", "50.000 + 8.000n ≥ 10.000"], "k": 1}, {"t": "pg", "q": "<p>Pada papan tulis, Pak Guru menuliskan sebuah soal latihan: \"Dua kali suatu bilangan ditambah 9 sama dengan tiga kali bilangan itu dikurangi 7.\" Jika bilangan itu x, nilai dari 2x − 3 adalah ….</p>", "o": ["13", "16", "35", "29"], "k": 3}, {"t": "pg", "q": "<p>Di Desa Arjosari, umur seorang ibu 24 tahun lebih tua daripada umur anaknya. Jumlah umur ibu dan anak tersebut adalah 52 tahun. Umur anak tersebut adalah ….</p>", "o": ["14 tahun", "18 tahun", "24 tahun", "38 tahun"], "k": 0}, {"t": "pg", "q": "<p>Sebuah kelompok belajar di SMP akan mencetak modul pendalaman materi. Biaya yang harus dibayar terdiri atas biaya desain sebesar Rp75.000,00 (dibayar sekali di awal) ditambah biaya cetak Rp4.500,00 per modul. Kelompok yang beranggotakan 12 siswa itu memiliki dana sebesar Rp435.000,00. Banyak modul terbanyak yang dapat dicetak adalah ….</p>", "o": ["78 modul", "96 modul", "80 modul", "90 modul"], "k": 2}, {"t": "pg", "q": "<p>Perhatikan dua struk pembayaran di kantin sekolah berikut.<br>Struk 1: 2 nasi bungkus dan 1 es teh seharga Rp21.000,00.<br>Struk 2: 1 nasi bungkus dan 2 es teh seharga Rp15.000,00.<br>Misalkan x adalah harga satu nasi bungkus dan y adalah harga satu es teh (dalam rupiah). Sistem persamaan yang sesuai dengan kedua struk tersebut adalah ….</p>", "o": ["2x + y = 21.000 dan x + 2y = 15.000", "2x + y = 15.000 dan x + 2y = 21.000", "x + y = 21.000 dan 2x + 2y = 15.000", "2x + 2y = 21.000 dan x + y = 15.000"], "k": 0}, {"t": "pg", "q": "<p>Di sebuah toko buah di Pacitan, harga 3 kg apel dan 2 kg jeruk adalah Rp85.000,00, sedangkan harga 1 kg apel dan 2 kg jeruk adalah Rp55.000,00. Harga 1 kg jeruk adalah ….</p>", "o": ["Rp15.000,00", "Rp17.500,00", "Rp25.000,00", "Rp20.000,00"], "k": 3}, {"t": "pg", "q": "<p>Pada majalah dinding sekolah terpampang sebuah teka-teki bilangan: \"Jumlah dua bilangan adalah 48 dan selisih kedua bilangan itu adalah 14.\" Bilangan yang terbesar adalah ….</p>", "o": ["17", "31", "24", "34"], "k": 1}, {"t": "pg", "q": "<p>Jumlah umur seorang ayah dan anaknya sekarang adalah 66 tahun. Lima tahun yang lalu, umur ayah adalah tiga kali umur anaknya. Umur ayah sekarang adalah ….</p>", "o": ["19 tahun", "42 tahun", "47 tahun", "52 tahun"], "k": 2}, {"t": "pg", "q": "<p>Bu Wulan membeli 5 kg gula pasir dan 2 kg tepung terigu di sebuah toko kelontong dengan total harga Rp103.000,00. Di toko yang sama, Bu Tini membeli 3 kg gula pasir dan 4 kg tepung terigu dengan total harga Rp101.000,00. Sebagai pembanding, harga minyak goreng di toko itu Rp18.000,00 per liter. Harga 1 kg gula pasir dan 2 kg tepung terigu adalah ….</p>", "o": ["Rp29.000,00", "Rp44.000,00", "Rp58.000,00", "Rp43.000,00"], "k": 3}, {"t": "pg", "q": "<p>Perhatikan diagram panah relasi \"dua kurangnya dari\" dari himpunan A = {3, 4, 5, 6} ke himpunan B = {1, 2, 3, 4, 5} berikut.</p><img class=\"tk-img\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAtAAAAHvCAMAAABKTRhLAAADAFBMVEX+/v4BAQHn5+cXFxfX19cmJia3t7enp6c3NzdHR0fHx8eXl5dXV1eHh4dnZ2d3d3cAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADs7Jr7AAAhQUlEQVR42u1dCZPzqJJscQhxCP7/vx2Qj3Z/04ctg1QFmbtvX8RGTI+Nk6qsg6qPDwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACpQLkPgHM47/AyFH6DakcopY8 h 12 kg. Pernyataan berikut yang benar adalah ….</p>", "o": ["Berat karung pertama adalah 33 kg", "Berat karung kedua adalah 24 kg", "Dua kali berat karung kedua adalah 42 kg", "Jika setiap karung ditambah 3 kg gabah, berat kedua karung menjadi 60 kg"], "k": [0, 2, 3]}, {"t": "mcma", "q": "<p>Relasi dari himpunan A = {2, 4, 6, 8} ke himpunan B = {1, 2, 3, 4} adalah \"dua kali dari\". Pernyataan berikut yang benar adalah ….</p>", "o": ["Range relasi tersebut adalah {1, 2, 3, 4}", "Relasi tersebut merupakan fungsi", "Relasi tersebut merupakan korespondensi satu-satu", "Domain relasi tersebut adalah {1, 2, 3, 4}"], "k": [0, 1, 2]}, {"t": "mcma", "q": "<p>Perhatikan pola susunan batang korek api yang membentuk segitiga berderet berikut.</p><img class=\"tk-img\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAtAAAADkCAMAAACG/eM8AAADAFBMVEX+/v6xbCurYhyuZiPGlGW8gky5e0HXtZTx5dq1dDfLnXLq2McoKCg2NjYFBQUXFxfn5+f38ezHx8f07OSXl5fBi1jX19doaGjSq4bjy7VHR0dXV1d2dnanp6e2trbNonmHh4fewabgxazm0bzu4NPcvaG+hlHVsI3t3tCpXRXDkF7Qpn6ybzCnWA6zcC8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABBm10tAAAS5UlEQVR42u2dC3ubuNPF8SW3jbiEUIi5laZt2nT7f7//x3s1wtj4hiUhBHjP79knSZ3AxuQwOjMaCccBAAAAAAAAAAAAAAD8NwgrpR/PY1wyMCUCnzGW asukkan 10 setel pakaian, berat total koper adalah 18 kg", "Jika dimasukkan 12 setel pakaian, koper masih memenuhi ketentuan bagasi"], "k": [true, true, true, false]}, {"t": "kat", "q": "<p>Sebuah biro wisata menawarkan paket kunjungan ke Pantai Klatak dengan rincian harga sebagai berikut.<br>Paket 1: 2 orang dewasa dan 2 anak-anak seharga Rp300.000,00.<br>Paket 2: 3 orang dewasa dan 1 anak-anak seharga Rp340.000,00.<br>Tentukan Benar/Salah untuk setiap pernyataan berikut.</p>", "s": ["Harga tiket untuk satu orang dewasa adalah Rp95.000,00", "Harga tiket untuk satu anak-anak adalah Rp60.000,00", "Harga untuk 1 orang dewasa dan 3 anak-anak adalah Rp260.000,00", "Selisih harga tiket dewasa dan anak-anak adalah Rp40.000,00"], "k": [true, false, true, true]}, {"t": "kat", "q": "<p>Sebuah fungsi h dinyatakan dalam tabel berikut.</p><table class=\"tk-tabel\"><tr><th>x</th><th>0</th><th>1</th><th>2</th><th>3</th></tr><tr><td>h(x)</td><td>5</td><td>8</td><td>11</td><td>14</td></tr></table><p>Tentukan Benar/Salah untuk setiap pernyataan berikut.</p>", "s": ["Nilai h(3) adalah 14", "Rumus fungsi tersebut adalah h(x) = 5x + 3", "Nilai h(6) adalah 23", "Nilai x yang membuat h(x) = 20 adalah 6"], "k": [true, false, true, false]}, {"t": "kat", "q": "<p>Menjelang acara pentas seni, siswa menyusun gelas plastik bertingkat di atas meja. Tingkat pertama (paling atas) berisi 2 gelas, tingkat kedua berisi 5 gelas, tingkat ketiga berisi 8 gelas, dan tingkat keempat berisi 11 gelas. Susunan dibuat sampai 6 tingkat. Tentukan Benar/Salah untuk setiap pernyataan berikut.</p>", "s": ["Tingkat ke-6 berisi 15 gelas", "Jumlah seluruh gelas pada susunan tersebut adalah 57 gelas", "Jika susunan diteruskan, tingkat ke-10 berisi 29 gelas", "Tingkat ke-4 berisi 12 gelas"], "k": [false, true, true, false]}]}, {"nama": "Geometri Datar", "sub": "Hubungan Antarsudut · Teorema Pythagoras · Kekongruenan · Kesebangunan · Keliling & Luas Segitiga dan Segi Empat", "items": [{"t": "pg", "q": "<p>Perhatikan ga menjadi 77. Nilai siswa yang mengikuti ulangan susulan adalah ….</p>", "o": ["85", "80", "83", "88"], "k": 0}, {"t": "pg", "q": "<p>Perhatikan tabel frekuensi nilai kuis Bahasa Indonesia berikut.</p><table class=\"tk-tabel\"><tr><th>Nilai</th><th>6</th><th>7</th><th>8</th><th>9</th></tr><tr><td>Banyak siswa</td><td>3</td><td>7</td><td>6</td><td>4</td></tr></table><p>Median dari data nilai kuis tersebut adalah ….</p>", "o": ["7", "7,5", "8", "8,5"], "k": 1}, {"t": "pg", "q": "<p>Pada acara pasar malam di alun-alun kecamatan, sebuah tas undian berisi 6 bola kuning dan 4 bola hijau yang berukuran sama dan tercampur merata. Jika diambil satu bola secara acak, peluang terambil bola kuning adalah ….</p>", "o": ["2/5", "5/3", "3/5", "3/4"], "k": 2}, {"t": "pg", "q": "<p>Dalam permainan ludo, Sinta melempar sebuah dadu bermata enam yang seimbang. Peluang muncul mata dadu lebih dari 4 adalah ….</p>", "o": ["1/3", "1/6", "1/2", "2/3"], "k": 0}, {"t": "pg", "q": "<p>Pada malam tirakatan di gardu ronda, warga bermain dengan satu set kartu bridge lengkap (52 kartu). Sebuah kartu diambil secara acak. Peluang terambil kartu wajah (Jack, Queen, atau King) adalah ….</p>", "o": ["1/13", "3/13", "4/13", "6/13"], "k": 1}, {"t": "pg", "q": "<p>Dua buah dadu bermata enam dilempar secara bersamaan. Peluang muncul jumlah mata dadu 8 atau 11 adalah ….</p>", "o": ["5/36", "1/6", "11/36", "7/36"], "k": 3}, {"t": "pg", "q": "<p>Sekelompok siswa melakukan percobaan mengambil satu kelereng dari sebuah kantong, mencatat warnanya, lalu mengembalikannya. Percobaan dilakukan sebanyak 60 kali dengan hasil sebagai berikut.</p><table class=\"tk-tabel\"><tr><th>Warna kelereng</th><th>Merah</th><th>Biru</th><th>Kuning</th><th>Hijau</th></tr><tr><td>Banyak muncul</td><td>18</td><td>24</td><td>12</td><td>6</td></tr></table><p>Berdasarkan hasil percobaan tersebut, perkiraan peluang terambil kelereng biru adalah ….</p>", "o": ["1/4", "3/10", "2/5", "1/3"], "k": 2}, {"t": "pg", "q": "<p>Sebuah toples berisi 5 /* ===== Penyimpanan lokal ===== */
var store=(function(){
  var KEY="tka-kab-state-v1";
  function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==="object")return s;}catch(e){}return null;}
  return{
    get:function(d){var s=load();return s||d;},
    set:function(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}
  };
})();
function defaults(){return{screen:"menu",nama:"",jenjang:"",rombel:"",sekolah:"",materi:0,
  answers:null,cur:0,startAt:0,deadline:0,result:null,saved:0,bests:{},menuMsg:null,confirmOpen:false,copied:false};}
var S=store.get(defaults());
if(S.screen==="game"&&(!S.answers||!S.deadline))S.screen="menu";
function save(){store.set(S);}
function set(nx,keepScroll){
  var y=window.scrollY||0;
  S=Object.assign({},S,nx);save();render();
  if(keepScroll)window.scrollTo(0,y);
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtNilai(n){return (Math.round(n*10)/10).toFixed(1).replace(".",",");}
function fmtPoin(p){return String(Math.round(p*100)/100).replace(".",",");}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.floor(sec/60),d=sec%60;
  return m+" menit "+(d<10?"0":"")+d+" detik";
}
function fmtClock(sec){
  sec=Math.max(0,Math.ceil(sec));
  var m=Math.floor(sec/60),d=sec%60;
  return (m<10?"0":"")+m+":"+(d<10?"0":"")+d;
}
function kelasStr(){return (S.jenjang||"")+(S.rombel||"");}
function materiObj(){return BANK[S.materi];}

/* ===== Combo sekolah (pola game lama) ===== */
function schoolComboHTML(){
  return '<div class="tk-dd" id="tk-sdd">'+
    '<input id="tk-sekolah-input" class="tk-input" type="text" autocomplete="off" placeholder="Ketik untuk cari sekolah..." value="'+esc(S.sekolah)+'">'+
    '<div id="tk-sekolah-list" class="tk-ddlist"></div></div>';
}
function renderSchoolList(q){
  var list=document.getElementById("tk-sekolah-list");if(!list)return;
  var query=(q||"").trim().toLowerCase();
  var matches=SCHOOLS.filter(function(s){return !query||s[0].toLowerCase().indexOf(query)>=0||s[2].toLowerCase().indexOf(query)>=0;}).slice(0,60);
  list.innerHTML=matches.length?matches.map(function(s){
    return '<div class="tk-dditem" data-v="'+esc(s[0])+'"><b>'+esc(s[0])+'</b><span>Kec. '+esc(s[2])+"</span></div>";
  }).join(""):'<div class="tk-ddempty">Sekolah tidak ditemukan</div>';
  list.style.display="block";
}
function hideSchoolList(){var l=document.getElementById("tk-sekolah-list");if(l)l.style.display="none";}
function bindSchoolCombo(){
  var inp=document.getElementById("tk-sekolah-input"),list=document.getElementById("tk-sekolah-list");
  if(!inp||!list)return;
  inp.addEventListener("input",function(){renderSchoolList(inp.value);});
  inp.addEventListener("focus",function(){renderSchoolList(inp.value);});
  list.addEventListener("click",function(e){
    var it=e.target.closest(".tk-dditem");if(!it)return;
    S.sekolah=it.getAttribute("data-v");save();
    inp.value=S.sekolah;hideSchoolList();
  });
}
function resolveSchool(){
  var inp=document.getElementById("tk-sekolah-input");
  var typed=inp?inp.value.trim():"";
  if(!typed)return "";
  var tl=typed.toLowerCase();
  if(S.sekolah&&S.sekolah.toLowerCase()===tl)return S.sekolah;
  for(var i=0;i<SCHOOLS.length;i++)if(SCHOOLS[i][0].toLowerCase()===tl)return SCHOOLS[i][0];
  return "";
}
function syncMenuInputs(){
  var nm=document.getElementById("tk-nama"),rb=document.getElementById("tk-rombel");
  if(nm)S.nama=nm.value;
  if(rb)S.rombel=rb.value.trim().toUpperCase().slice(0,3);
}

/* ===== Alur sesi ===== */
function blankAnswers(items){
  return items.map(function(it){
    if(it.t==="pg")return null;
    if(it.t==="mcma")return [];
    return [null,null,null,null];
  });
}
function isDone(it,a){
  if(a==null)return false;
  if(it.t==="pg")return a!==null;
  if(it.t==="mcma")return a.length>0;
  return a.every(function(x){return x!==null;});
}
function doneCount(){
  var items=materiObj().items,c=0;
  for(var i=0;i<items.length;i++)if(isDone(items[i],S.answers[i]))c++;
  return c;
}
function startGame(){
  syncMenuInputs();
  var sk=resolveSchool();
  if(!S.nama.trim()||!S.jenjang||!sk){
    set({menuMsg:"Isi nama, pilih kelas, dan pilih sekolah dari daftar ya!"});return;
  }
  S.sekolah=sk;
  var now=Date.now();
  set({screen:"game",answers:blankAnswers(materiObj().items),cur:0,
    startAt:now,deadline:now+TOTAL_TIME*1000,result:null,saved:0,menuMsg:null,confirmOpen:false,copied:false});
  window.scrollTo(0,0);
}
function grade(){
  var items=materiObj().items,pts=0;
  var d={pg:0,mcma:0,katStmt:0,katFull:0,full:0};
  items.forEach(function(it,i){
    var a=S.answers?S.answers[i]:null;
    if(it.t==="pg"){
      if(a===it.k){pts+=1;d.pg++;d.full++;}
    }else if(it.t==="mcma"){
      var ok=a&&a.length===it.k.length&&it.k.every(function(k){return a.indexOf(k)>=0;});
      if(ok){pts+=1;d.mcma++;d.full++;}
    }else{
      var c=0;
      for(var j=0;j<4;j++)if(a&&a[j]===it.k[j])c++;
      pts+=c*0.25;d.katStmt+=c;
      if(c===4){d.katFull++;d.full++;}
    }
  });
  return{poin:pts,nilai:Math.round(pts/TOTAL_Q*1000)/10,d:d};
}
function finishGame(auto){
  if(S.screen!=="game")return;
  var g=grade();
  var used=auto?TOTAL_TIME:Math.min(TOTAL_TIME,Math.max(0,Math.round((Date.now()-S.startAt)/1000)));
  var bests=Object.assign({},S.bests);
  var mname=materiObj().nama;
  if(!bests[mname]||g.nilai>bests[mname])bests[mname]=g.nilai;
  set({screen:"result",confirmOpen:false,bests:bests,saved:FB?1:3,
    result:{nilai:g.nilai,poin:g.poin,d:g.d,durasi:used,auto:!!auto,materi:mname}});
  window.scrollTo(0,0);
  if(FB)saveScore(g,used);
}
function saveScore(g,used){
  var payload={
    nama:S.nama.trim(),kelas:kelasStr(),sekolah:S.sekolah,mode:materiObj().nama,
    skor:g.nilai,nilai:g.nilai,poin:g.poin,benar:g.d.full,total:TOTAL_Q,
    benarPG:g.d.pg,benarMCMA:g.d.mcma,benarKategori:g.d.katStmt,katPenuh:g.d.katFull,
    akurasi:Math.round(g.nilai),durasi:used,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  };
  try{
    FB.collection(SCORE_COLLECTION).add(payload)
      .then(function(){if(S.screen==="result")set({saved:2},true);})
      .catch(function(){if(S.screen==="result")set({saved:3},true);});
  }catch(e){if(S.screen==="result")set({saved:3},true);}
}

/* ===== Hitung mundur total 60 menit ===== */
function remainSec(){return Math.max(0,(S.deadline-Date.now())/1000);}
setInterval(function(){
  if(S.screen!=="game")return;
  var r=remainSec();
  var t=document.getElementById("tk-time"),bar=document.getElementById("tk-tfill");
  if(t){t.textContent="⏱ "+fmtClock(r);t.classList.toggle("warn",r<=300);}
  if(bar){bar.style.width=(r/TOTAL_TIME*100)+"%";bar.classList.toggle("warn",r<=300);}
  if(r<=0)finishGame(true);
},400);

function questionHTML(){
  var m=materiObj(),it=m.items[S.cur],a=S.answers[S.cur];
  var r=remainSec();
  var h='<div class="tk-head"><span class="tk-mname">'+esc(m.nama)+'</span>'+
    '<span class="tk-time'+(r<=300?" warn":"")+'" id="tk-time">⏱ '+fmtClock(r)+"</span></div>";
  h+='<div class="tk-tbar"><div class="tk-tfill'+(r<=300?" warn":"")+'" id="tk-tfill" style="width:'+(r/TOTAL_TIME*100)+'%"></div></div>';
  h+='<div class="tk-meta"><span>Soal '+(S.cur+1)+" dari "+TOTAL_Q+'</span><span>Terjawab: '+doneCount()+"/"+TOTAL_Q+"</span></div>";
  h+='<div class="tk-q">'+it.q+"</div>";
  var letters=["A","B","C","D"];
  if(it.t==="pg"){
    h+='<div class="tk-hint">Pilih satu jawaban yang paling tepat.</div>';
    h+=it.o.map(function(o,i){
      return '<button class="tk-opt'+(a===i?" sel":"")+'" data-act="pg" data-v="'+i+'"><span class="tk-letter">'+letters[i]+'</span><span class="tk-obody">'+o+"</span></button>";
    }).join("");
  }else if(it.t==="mcma"){
    h+='<div class="tk-hint">⚠️ Pilihan ganda kompleks — pilih <b>semua</b> jawaban yang benar (bisa lebih dari satu).</div>';
    h+=it.o.map(function(o,i){
      var sel=a&&a.indexOf(i)>=0;
      return '<button class="tk-opt'+(sel?" sel":"")+'" data-act="mcma" data-v="'+i+'"><span class="tk-letter">'+(sel?"✓":letters[i])+'</span><span class="tk-obody">'+o+"</span></button>";
    }).join("");
  }else{
    h+='<div class="tk-hint">Tentukan <b>Benar</b> atau <b>Salah</b> untuk setiap pernyataan.</div>';
    h+=it.s.map(function(s,j){
      var v=a?a[j]:null;
      return '<div class="tk-katrow"><div class="tk-stmt"><b>('+(j+1)+")</b> "+s+'</div><div class="tk-bs">'+
        '<button data-act="kat" data-i="'+j+'" data-v="1" class="'+(v===true?"selB":"")+'">✔ Benar</button>'+
        '<button data-act="kat" data-i="'+j+'" data-v="0" class="'+(v===false?"selS":"")+'">✘ Salah</button></div></div>';
    }).join("");
  }
  h+='<div class="tk-navrow">'+
    '<button class="tk-btn ghost" data-act="prev"'+(S.cur===0?" disabled":"")+'>← Sebelumnya</button>'+
    (S.cur<TOTAL_Q-1
      ? '<button class="tk-btn" data-act="next" style="margin-top:0">Berikutnya →</button>'
      : '<button class="tk-btn" data-act="finish" style="margin-top:0">✔ Selesai &amp; Kumpulkan</button>')+
    "</div>";
  h+='<div class="tk-palabel">Palet Nomor Soal</div><div class="tk-pal">';
  h+=m.items.map(function(it2,i){
    var cls=(i===S.cur?"cur":"")+(isDone(it2,S.answers[i])?" done":"");
    return '<button class="'+cls+'" data-act="pal" data-v="'+i+'">'+(i+1)+"</button>";
  }).join("");
  h+="</div>";
  if(S.cur<TOTAL_Q-1)h+='<button class="tk-btn" data-act="finish">✔ Selesai &amp; Kumpulkan</button>';
  return h;
}
function modalHTML(){
  if(!S.confirmOpen)return "";
  var done=doneCount(),sisa=TOTAL_Q-done;
  return '<div class="tk-overlay"><div class="tk-modal"><h3>Kumpulkan jawaban?</h3>'+
    "<p>Kamu sudah menjawab <b>"+done+" dari "+TOTAL_Q+" soal</b>."+
    (sisa>0?" Masih ada <b>"+sisa+" soal</b> yang belum dijawab tuntas — soal itu akan dinilai dari jawaban yang ada (bisa 0 poin).":"")+
    "</p><p>Setelah dikumpulkan, jawaban tidak bisa diubah lagi.</p>"+
    '<div class="tk-navrow"><button class="tk-btn ghost" data-act="cancelFinish">Kembali</button>'+
    '<button class="tk-btn" data-act="confirmFinish" style="margin-top:0">Ya, Kumpulkan</button></div></div></div>';
}

/* ===== Tampilan: Hasil ===== */
function saveStatHTML(){
  if(S.saved===2)return '<p class="tk-savestat ok">✅ Nilai tersimpan di database</p>';
  if(S.saved===1)return '<p class="tk-savestat wait">⏳ Menyimpan nilai...</p>';
  return '<p class="tk-savestat fail">⚠️ Nilai tidak tersimpan (periksa koneksi)</p>';
}
function resultHTML(){
  var r=S.result,d=r.d;
  var msg;
  if(r.nilai>=90)msg="Luar biasa! Kamu siap menghadapi TKA!";
  else if(r.nilai>=75)msg="Hebat! Sedikit lagi sempurna.";
  else if(r.nilai>=55)msg="Bagus! Terus berlatih pada soal yang belum dikuasai.";
  else msg="Jangan menyerah — pelajari lagi materinya dan coba lagi ya!";
  var h='<h2 class="tk-title">Selesai!</h2><p class="tk-msg">'+msg+"</p>";
  if(r.auto)h+='<p class="tk-msg">⏰ Waktu 60 menit habis — sesi diselesaikan otomatis dan dinilai dari jawaban yang ada.</p>';
  h+='<div class="tk-namecard">👤 '+esc(S.nama)+" &bull; Kelas "+esc(kelasStr())+"<br><span>"+esc(S.sekolah)+"</span></div>";
  h+=saveStatHTML();
  h+='<div class="tk-big">'+fmtNilai(r.nilai)+"</div>";
  h+='<p class="tk-msg">Nilai akhir — Materi: <b>'+esc(r.materi)+"</b></p>";
  h+='<div class="tk-stats">';
  h+='<div class="tk-stat"><b>'+d.pg+"/20</b><span>Pilihan Ganda benar</span></div>";
  h+='<div class="tk-stat"><b>'+d.mcma+"/5</b><span>PGK-MCMA benar (persis)</span></div>";
  h+='<div class="tk-stat"><b>'+d.katStmt+"/20</b><span>Pernyataan Kategori tepat ("+d.katFull+"/5 soal penuh)</span></div>";
  h+='<div class="tk-stat"><b>'+fmtPoin(r.poin)+"/30</b><span>Total poin</span></div>";
  h+='<div class="tk-stat"><b>'+fmtDur(r.durasi)+'</b><span>Waktu tempuh</span></div>';
  h+='<div class="tk-stat"><b>'+d.full+"/30</b><span>Soal bernilai penuh</span></div>";
  h+="</div>";
  h+='<button class="tk-btn" data-act="copy">'+(S.copied?"✅ Hasil Tersalin!":"📋 Salin Hasil")+"</button>";
  h+='<button class="tk-btn ghost" data-act="again">↻ Kerjakan Lagi Materi Ini</button>';
  h+='<button class="tk-btn ghost" data-act="menu">Ganti Materi</button>';
  return h;
}
function copyText(){
  var r=S.result,d=r.d;
  var txt="🏆 Try Out TKA — Per Materi Esensial\n"+
    "Nama: "+S.nama.trim()+"\n"+
    "Kelas: "+kelasStr()+"\n"+
    "Sekolah: "+S.sekolah+"\n"+
    "Materi: "+r.materi+"\n"+
    "Nilai: "+fmtNilai(r.nilai)+"\n"+
    "Benar — PG: "+d.pg+"/20 • MCMA: "+d.mcma+"/5 • Kategori: "+d.katStmt+"/20 pernyataan\n"+
    "Waktu: "+fmtDur(r.durasi);
  function done(){set({copied:true},true);setTimeout(function(){if(S.screen==="result")set({copied:false},true);},2200);}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(function(){fallback();});
  }else fallback();
  function fallback(){
    var ta=document.createElement("textarea");
    ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");}catch(e){}
    document.body.removeChild(ta);done();
  }
}

/* ===== Render & peristiwa ===== */
function render(){
  var body=document.getElementById("tk-body");
  if(S.screen==="menu"){body.innerHTML=menuHTML();bindSchoolCombo();}
  else if(S.screen==="game")body.innerHTML=questionHTML();
  else body.innerHTML=resultHTML();
  document.getElementById("tk-modal-root").innerHTML=(S.screen==="game")?modalHTML():"";
}
document.addEventListener("click",function(e){
  if(!e.target.closest("#tk-sdd"))hideSchoolList();
});
document.getElementById("tk-body").addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el||el.disabled)return;
  var act=el.getAttribute("data-act"),v=el.getAttribute("data-v");
  if(act==="jenjang"){syncMenuInputs();set({jenjang:v,menuMsg:null},true);}
  else if(act==="materi"){syncMenuInputs();set({materi:parseInt(v,10),menuMsg:null},true);}
  else if(act==="start")startGame();
  else if(act==="pg"){var a=S.answers.slice();a[S.cur]=parseInt(v,10);set({answers:a},true);}
  else if(act==="mcma"){
    var a2=S.answers.slice();var cur=a2[S.cur].slice();var iv=parseInt(v,10);
    var ix=cur.indexOf(iv);if(ix>=0)cur.splice(ix,1);else cur.push(iv);
    cur.sort();a2[S.cur]=cur;set({answers:a2},true);
  }
  else if(act==="kat"){
    var a3=S.answers.slice();var row=a3[S.cur].slice();
    row[parseInt(el.getAttribute("data-i"),10)]=(v==="1");
    a3[S.cur]=row;set({answers:a3},true);
  }
  else if(act==="pal")set({cur:parseInt(v,10)});
  else if(act==="prev")set({cur:Math.max(0,S.cur-1)});
  else if(act==="next")set({cur:Math.min(TOTAL_Q-1,S.cur+1)});
  else if(act==="finish")set({confirmOpen:true},true);
  else if(act==="again"){
    var now=Date.now();
    set({screen:"game",answers:blankAnswers(materiObj().items),cur:0,startAt:now,
      deadline:now+TOTAL_TIME*1000,result:null,saved:0,confirmOpen:false,copied:false});
    window.scrollTo(0,0);
  }
  else if(act==="menu")set({screen:"menu",confirmOpen:false,menuMsg:null});
  else if(act==="copy")copyText();
});
document.getElementById("tk-modal-root").addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.getAttribute("data-act");
  if(act==="cancelFinish")set({confirmOpen:false},true);
  else if(act==="confirmFinish")finishGame(false);
});
/* Bila waktu habis saat halaman tidak dibuka, selesaikan saat dimuat */
if(S.screen==="game"&&remainSec()<=0)finishGame(true);else render();
})();
</script>
</body>
</html>
